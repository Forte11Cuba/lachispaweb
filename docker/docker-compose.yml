version: '3.8'

services:
  # Production HTTP service (static files from public/ directory)
  # Run with: docker compose --profile production up web
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    profiles:
      - production
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Development service (live reload, static files from public/ directory)
  # Run with: docker compose --profile dev up dev
  dev:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    ports:
      - "8080:80"
    volumes:
      - ../public:/usr/share/nginx/html
    restart: unless-stopped
    profiles:
      - dev

  # Production HTTPS service (static files from public/ directory)
  # Run with: docker compose --profile production up production
  production:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "443:443"
    volumes:
      - ./ssl:/etc/nginx/ssl:ro
      - ./nginx-ssl.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    profiles:
      - production
